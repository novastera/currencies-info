name: Publish Package to npmjs

# Trusted publisher on npm must use workflow filename: publish.yml (exact match)
# Configure at https://www.npmjs.com/package/@novastera-oss/currencies-info → Settings → Trusted Publisher
#   Organization: novastera
#   Repository: currencies-info
#   Workflow filename: publish.yml
#   Environment name: production
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # Required for OIDC trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do not set registry-url here: it writes an empty _authToken that
          # blocks npm OIDC trusted publishing (ENEEDAUTH).

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Update version from release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Publishing version: $VERSION"

          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "✅ Version updated to $VERSION"

      - name: Build the project
        run: npm run build

      - name: Test the project
        run: npm test

      - name: Publish to NPM
        run: npm publish --provenance --access public
